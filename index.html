<title>Atlas of Type</title>
<meta name="description" content="A 3D globe of the world’s typefaces and writing systems, each in the place it was made. Spin it, open a country, and take any letter apart to see its anatomy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: the globe fills the screen like an instrument on a bench; title top left, controls top right, hints and readout along the bottom. Picking a country slides a reading panel in from the right (a sheet from the bottom on phones) and the globe steps aside. Colours are the mthecreative brand: off-white ground, near-black ink, one red for actions and saved items; mapped countries are light grey, the selected one dark grey. */
:root {
  --ground: #F5F0EB;
  --paper: #FBF8F5;
  --ink: #1A1A1A;
  --text-2: #4A4541;
  --muted: #847D76;
  --faint: #C4BCB3;
  --rule: #E5DDD4;
  --well: #EDE6DE;
  --card-shadow: 0 0 0 1px rgb(26 26 26 / .06), 0 1px 2px 0 rgb(26 26 26 / .04), 0 2px 8px -2px rgb(26 26 26 / .08);
  --panel-shadow: -1px 0 0 0 rgb(26 26 26 / .07), -24px 0 48px -24px rgb(26 26 26 / .16);
  --halo: rgb(26 26 26 / .10);

  --globe-ocean: #EEE8E1;
  --globe-land: #FBF8F5;
  --globe-feat: #DCD5CD;
  --globe-feat-hover: #C9C1B8;
  --globe-hover: #E9E2DA;
  --globe-sel: #6A645E;
  --globe-border: #A69E95;
  --globe-grid: #E3DCD3;
  --globe-shade: #D1C9BF;
  --globe-rim: #BFB7AD;

  --accent: #C53B31;
  --accent-ink: #F5F0EB;
  --accent-soft: #F5DFDA;

  --sans: "Geist", "Helvetica Neue", Arial, system-ui, sans-serif;
  --serif: "EB Garamond", Garamond, "Times New Roman", serif;
  --panel-w: min(480px, max(42vw, 360px));
  --panel-space: 0px;
  --ease: cubic-bezier(.22, .75, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #1A1A1A; --paper: #222120; --ink: #F5F0EB; --text-2: #BDB6AE; --muted: #8C857E; --faint: #514C47;
    --rule: #302D2A; --well: #2A2725; --halo: rgb(0 0 0 / .55);
    --card-shadow: 0 0 0 1px rgb(245 240 235 / .07), 0 2px 8px -2px rgb(0 0 0 / .6);
    --panel-shadow: -1px 0 0 0 rgb(245 240 235 / .08), -24px 0 48px -24px rgb(0 0 0 / .8);
    --globe-ocean: #1E1D1C; --globe-land: #2A2725; --globe-feat: #423E3A; --globe-feat-hover: #504B46; --globe-hover: #322F2C; --globe-sel: #8C857E;
    --globe-border: #645E58; --globe-grid: #262423; --globe-shade: #0D0C0B; --globe-rim: #423E3A;
    --accent: #E8665B; --accent-ink: #1A1A1A; --accent-soft: #3D2421;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #1A1A1A; --paper: #222120; --ink: #F5F0EB; --text-2: #BDB6AE; --muted: #8C857E; --faint: #514C47;
    --rule: #302D2A; --well: #2A2725; --halo: rgb(0 0 0 / .55);
    --card-shadow: 0 0 0 1px rgb(245 240 235 / .07), 0 2px 8px -2px rgb(0 0 0 / .6);
    --panel-shadow: -1px 0 0 0 rgb(245 240 235 / .08), -24px 0 48px -24px rgb(0 0 0 / .8);
    --globe-ocean: #1E1D1C; --globe-land: #2A2725; --globe-feat: #423E3A; --globe-feat-hover: #504B46; --globe-hover: #322F2C; --globe-sel: #8C857E;
    --globe-border: #645E58; --globe-grid: #262423; --globe-shade: #0D0C0B; --globe-rim: #423E3A;
    --accent: #E8665B; --accent-ink: #1A1A1A; --accent-soft: #3D2421;
  color-scheme: dark;
}

[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
html, body { height: 100%; }
body {
  background: var(--ground); color: var(--ink); font: 450 15px/1.5 var(--sans); overflow: hidden;
  -webkit-font-smoothing: antialiased; font-synthesis: none;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; border-radius: 2px; }
a { color: inherit; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--ink); }
em.g { font-family: var(--serif); font-style: italic; font-size: 1.1em; letter-spacing: -.005em; }

/* ---------- stage ---------- */
.stage { position: fixed; inset: 0; }
#globe { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; outline: none; }
#globe.dragging { cursor: grabbing; }
#globe.pointing { cursor: pointer; }
.halo { position: absolute; left: 0; top: 0; pointer-events: none; border-radius: 50%; background: radial-gradient(closest-side, var(--halo), transparent); will-change: transform; }
.pins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pin {
  position: absolute; left: 0; top: 0; width: 0; height: 0; padding: 0; border: 0; background: none;
  pointer-events: none; visibility: hidden; will-change: transform, opacity; cursor: pointer; color: var(--ink);
}
.pin:focus-visible { outline: none; }
.pin .dot, .pin .chip { pointer-events: auto; }
.pin .dot { position: absolute; left: -4.5px; top: -4.5px; width: 9px; height: 9px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--paper); transition: background .2s var(--ease); }
.pin .chip {
  position: absolute; left: 0; bottom: 10px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 7px; min-height: 26px; padding: 2px 8px; box-sizing: border-box;
  border-radius: 7px; background: var(--paper); color: var(--ink); box-shadow: var(--card-shadow); white-space: nowrap;
  transition: background .2s var(--ease), color .2s var(--ease);
}
.pin .code { font-size: 16px; line-height: 1; letter-spacing: .02em; }
.pin .code.glyph { font-size: 20px; line-height: 1.35; letter-spacing: 0; min-width: 16px; text-align: center; }
.pin .code.vert { writing-mode: vertical-lr; font-size: 28px; line-height: 1; padding: 2px 0; }
.pin .code.plain { font-family: var(--sans); font-weight: 600; font-size: 13px; letter-spacing: .06em; }
.pin .full { display: none; font: 500 12.5px/1 var(--sans); color: var(--text-2); }
.pin.full .full { display: inline; }
.pin.nocode .code { display: none; }
.pin.no-label .chip { visibility: hidden; }
.pin.at-below .chip { bottom: auto; top: 10px; }
.pin.at-right .chip { bottom: auto; top: 0; left: 10px; transform: translateY(-50%); }
.pin.at-left .chip { bottom: auto; top: 0; left: auto; right: 10px; transform: translateY(-50%); }
.pin:hover .chip, .pin.is-sel .chip, .pin:focus-visible .chip { background: var(--ink); color: var(--paper); }
.pin:hover .full, .pin.is-sel .full, .pin:focus-visible .full { color: var(--paper); opacity: .78; }
.pin.is-sel .dot { background: var(--accent); }
.pin:focus-visible .chip { outline: 1.5px solid var(--ink); outline-offset: 2px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--text-2); padding: 24px; }
.nogl p { max-width: 36ch; margin: 0; }

/* ---------- masthead ---------- */
.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 3; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-bottom: 0;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.top > * { pointer-events: auto; }
.top::before { content: ""; position: absolute; inset: 0 0 -28px; z-index: -1; pointer-events: none; background: linear-gradient(var(--ground) 40%, transparent); }
.bottom::before { content: ""; position: absolute; inset: -24px 0 0; z-index: -1; pointer-events: none; background: linear-gradient(transparent, var(--ground) 60%); }
.brand h1 { margin: 0; font-size: 15px; font-weight: 550; }
.brand h1 span { color: var(--muted); font-weight: 450; }
.brand p { margin: 6px 0 0; color: var(--text-2); max-width: 38ch; text-wrap: pretty; }
.actions { display: flex; align-items: center; gap: 18px; flex: none; transition: opacity .3s var(--ease), transform .45s var(--ease), visibility 0s; }
/* when the panel opens, the header controls slide right into it and the panel's own copies take over */
.actions.tucked { opacity: 0; transform: translateX(40px); pointer-events: none; visibility: hidden; transition: opacity .25s var(--ease), transform .45s var(--ease), visibility 0s linear .45s; }
.link-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--muted); font-size: 13px; }
.link-btn:hover, .link-btn[aria-expanded="true"] { color: var(--ink); }
.link-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.i-sun { display: none; }
.is-dark .i-sun { display: block; }
.is-dark .i-moon { display: none; }

/* ---------- bottom bar ---------- */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none;
  display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap;
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); padding-top: 0;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  font-size: 13px; color: var(--muted);
  container-type: inline-size; box-sizing: border-box;
  transition: padding-right .55s var(--ease);
}
.bottom.shifted { padding-right: calc(var(--panel-space) + 24px); }
.bottom > * { pointer-events: auto; }
.bottom > .bottom-row { pointer-events: none; }
.bottom-row > * { pointer-events: auto; }
/* narrow bottom bars (tablets, panel open): readout on its own line, fewer hints */
@container (max-width: 620px) {
  .hint-turn { display: none !important; }
  .readout { order: -1; flex-basis: 100%; margin-left: 0 !important; }
}
@container (max-width: 380px) { .hint-long { display: none !important; } }
.k { display: inline-flex; align-items: center; gap: 6px; }
kbd, .kbtn {
  display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box;
  font: 500 12px/1 var(--sans); color: var(--ink); background: var(--well); border: 0; border-radius: 4px;
}
.kbtn { cursor: pointer; }
.kbtn:hover { background: var(--rule); }
.readout { margin-left: auto; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- identity ---------- */
.brand { display: flex; gap: 12px; align-items: flex-start; }
.logo { width: 34px; height: 34px; flex: none; color: var(--ink); margin-top: -2px; }
.logo .acc { stroke: var(--accent); }
.brand-text { min-width: 0; }
.credit { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--muted); text-decoration: none; pointer-events: auto; }
.credit svg { width: 19px; height: 9px; fill: #C53B31; flex: none; transform: translateY(-.5px); }
.credit:hover { color: var(--ink); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.credit:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }

/* ---------- dock: layers + timeline ---------- */
.bottom { flex-direction: column; align-items: stretch; gap: 10px; }
.bottom-row { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
.dock {
  align-self: center; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center;
  background: var(--paper); box-shadow: var(--card-shadow); border-radius: 12px; padding: 8px 10px; max-width: 100%; box-sizing: border-box;
}
.seg { display: inline-flex; background: var(--well); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; font-size: 13px; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: var(--card-shadow); font-weight: 550; }
.timeline { display: flex; align-items: center; gap: 10px; min-width: 0; }
.play-btn { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.play-btn svg { width: 12px; height: 12px; fill: currentColor; }
.timeline input[type="range"] { width: clamp(140px, 26vw, 320px); accent-color: var(--accent); }
.tl-year { min-width: 7.5ch; font-variant-numeric: tabular-nums; color: var(--ink); font-size: 13px; font-weight: 550; text-align: right; }
@container (max-width: 560px) { .dock { width: 100%; flex-direction: column; align-items: stretch; gap: 8px; } .seg button { flex: 1; } .timeline input[type="range"] { width: auto; flex: 1; min-width: 0; } }

/* ---------- action buttons ---------- */
.link-btn.primary { color: var(--accent); }
.link-btn.primary:hover { color: var(--ink); }
.chip { display: inline-block; font-size: 11px; font-weight: 550; letter-spacing: .02em; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 2px 6px; vertical-align: 2px; margin-left: 6px; }
.sheet-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 5px 10px; font-size: 13px; font-weight: 500; cursor: pointer; }
.sheet-btn:hover { opacity: .88; }
.sheet-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.also { margin: 28px 0 0; padding: 12px 14px; border-radius: 8px; background: var(--well); font-size: 14px; color: var(--text-2); }
.also button { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 550; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- modals ---------- */
dialog.modal {
  border: 0; padding: 0; width: min(920px, calc(100vw - 32px)); max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px);
  border-radius: 14px; background: var(--paper); color: var(--ink); box-shadow: 0 30px 80px -20px rgb(0 0 0 / .45);
}
dialog.modal::backdrop { background: rgb(0 0 0 / .35); backdrop-filter: blur(2px); }
dialog.modal[open] { display: flex; flex-direction: column; animation: pop .35s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }
.m-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 24px 12px; border-bottom: 1px solid var(--rule); }
.m-bar h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.m-bar .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.m-body { overflow-y: auto; overscroll-behavior: contain; padding: 20px 24px 28px; }
.tabs { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--rule); }
.tabs button { border: 0; background: none; padding: 10px 4px; margin-right: 14px; font-size: 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 550; }

/* specimen sheet */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 24px; align-items: end; }
.hero .aa { font-size: clamp(96px, 16vw, 200px); line-height: .9; letter-spacing: -.02em; overflow-wrap: anywhere; }
.hero .glyphs { font-size: 22px; line-height: 1.45; color: var(--text-2); overflow-wrap: anywhere; }
.weights { margin: 28px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
.weights li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.weights .w { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.weights .line { font-size: 26px; line-height: 1.2; overflow-wrap: anywhere; }
.tester { margin-top: 24px; display: grid; gap: 10px; }
.tester-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.tester-row input[type="text"] { flex: 1; min-width: 200px; height: 36px; padding: 0 12px; border: 0; border-radius: 6px; background: var(--well); color: var(--ink); font: inherit; }
.tester-row input[type="range"] { accent-color: var(--accent); }
.tester-out { font-size: 64px; line-height: 1.1; overflow-wrap: anywhere; min-height: 1.2em; padding: 10px 0; }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 20px; }

/* play */
.game { display: grid; gap: 18px; justify-items: center; text-align: center; }
.game .score { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.game .stage-word { font-size: clamp(56px, 11vw, 120px); line-height: 1.05; min-height: 1.1em; overflow-wrap: anywhere; transition: opacity .25s; }
.game .stage-word.wait { opacity: 0; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(520px, 100%); }
.opts button { border: 0; background: var(--well); color: var(--ink); border-radius: 8px; padding: 12px; font-size: 15px; cursor: pointer; }
.opts button:hover:not(:disabled) { background: var(--rule); }
.opts button.right { background: var(--ink); color: var(--paper); }
.opts button.wrong { text-decoration: line-through; color: var(--muted); }
.opts button:disabled { cursor: default; }
.feedback { min-height: 1.5em; font-size: 15px; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn { border: 0; border-radius: 8px; padding: 9px 14px; font-size: 14px; cursor: pointer; background: var(--well); color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 550; }
.btn:hover { opacity: .9; }
.name-input { width: 100%; box-sizing: border-box; height: 44px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--well); color: var(--ink); font: inherit; font-size: 16px; }
.name-grid { list-style: none; margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.name-grid button { width: 100%; text-align: left; border: 0; background: var(--ground); box-shadow: var(--card-shadow); border-radius: 10px; padding: 14px 16px; cursor: pointer; color: var(--ink); display: grid; gap: 8px; min-width: 0; }
.name-grid button:hover { box-shadow: 0 0 0 1.5px var(--accent); }
.name-grid .nm { font-size: 34px; line-height: 1.15; overflow-wrap: anywhere; }
.name-grid .meta { font-size: 12px; color: var(--muted); }

/* suggest */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.form label { display: grid; gap: 6px; font-size: 13px; color: var(--text-2); }
.form .full { grid-column: 1 / -1; }
.form input, .form select, .form textarea { width: 100%; box-sizing: border-box; border: 0; border-radius: 6px; background: var(--well); color: var(--ink); font: inherit; font-size: 14px; padding: 9px 11px; }
.form textarea { min-height: 70px; resize: vertical; }
.form .req { color: var(--accent); }
.form-note { margin: 0 0 16px; color: var(--text-2); font-size: 14px; line-height: 1.55; }
.status { margin: 14px 0 0; font-size: 14px; min-height: 1.4em; }
.status.err { color: #C0362C; }
.queue { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.queue li { background: var(--ground); box-shadow: var(--card-shadow); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; }
.queue .q-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-weight: 550; }
.queue .q-meta { font-size: 13px; color: var(--muted); }
.queue .q-links { display: flex; gap: 14px; font-size: 13px; flex-wrap: wrap; }
.queue .q-actions { display: flex; gap: 8px; margin-top: 4px; }

@media (max-width: 720px) {
  dialog.modal { width: 100vw; max-width: 100vw; height: 100%; max-height: 100%; border-radius: 0; margin: 0; }
  .hero { grid-template-columns: 1fr; }
  .weights li { grid-template-columns: 1fr; gap: 2px; }
  .form { grid-template-columns: 1fr; }
  .link-btn .lbl { display: none; }
  .tester-out { font-size: 44px; }
}

/* ---------- panel ---------- */
.panel {
  position: fixed; z-index: 4; top: 0; right: 0; bottom: 0; width: var(--panel-w); box-sizing: border-box;
  background: var(--paper); box-shadow: var(--panel-shadow);
  display: flex; flex-direction: column; min-width: 0;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
  transform: translateX(calc(100% + 32px)); visibility: hidden;
  transition: transform .55s var(--ease), visibility 0s linear .55s;
}
.panel.open { transform: none; visibility: visible; transition: transform .55s var(--ease), visibility 0s; }
.panel-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 28px 0; }
.panel-bar .crumb { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.panel-bar .crumb:hover { color: var(--ink); }
.bar-tools { display: flex; align-items: center; gap: 16px; margin-left: auto; }
.panel.open .bar-tools { animation: tuckIn .5s var(--ease) both .12s; }
@keyframes tuckIn { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
.close { width: 32px; height: 32px; border: 0; background: var(--well); border-radius: 6px; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
.close:hover { background: var(--rule); }
.close svg { width: 12px; height: 12px; }
.panel-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 18px 28px 40px; touch-action: pan-y; }

/* staggered reveal of panel content */
.rv { opacity: 0; transform: translateY(10px); }
.panel.open .rv { animation: rise .6s var(--ease) both; animation-delay: calc(120ms + var(--i, 0) * 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.eyebrow { margin: 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.title { margin: 6px 0 0; font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.lede { margin: 10px 0 0; color: var(--text-2); }
.jump { margin: 14px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.jump button { border: 0; background: var(--well); color: var(--text-2); border-radius: 4px; padding: 4px 8px; font-size: 13px; cursor: pointer; }
.jump button:hover { color: var(--ink); background: var(--rule); }
.tools { display: grid; grid-template-columns: 1fr 150px; gap: 12px; margin-top: 20px; align-items: center; }
.tools input[type="text"] {
  width: 100%; box-sizing: border-box; height: 36px; padding: 0 12px; border: 0; border-radius: 6px;
  background: var(--well); color: var(--ink); font: inherit; font-size: 14px;
}
.tools input[type="text"]::placeholder { color: var(--muted); }
.tools input[type="text"]:focus { outline: 1.5px solid var(--faint); outline-offset: 0; }
.size { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.size input { flex: 1; min-width: 0; accent-color: var(--ink); }
.size output { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 4.5ch; text-align: right; }
.faces { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 36px; }
.face { display: grid; gap: 10px; min-width: 0; scroll-margin-top: 12px; }
.spec { background: var(--ground); border-radius: 10px; box-shadow: var(--card-shadow); padding: 14px 16px 18px; min-width: 0; }
.spec-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); }
.spec-head > span { white-space: nowrap; }
.panel-body { container-type: inline-size; }
@container (max-width: 400px) {
  .tools { grid-template-columns: 1fr; }
  .hm-cap { max-width: 40%; font-size: 11px; }
  .face-head { flex-wrap: wrap; }
}
.pic-strip {
  display: flex; gap: 10px; margin-top: 16px; padding: 2px 2px 12px; overflow-x: auto; overflow-y: hidden;
  overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
}
.pic-strip { scrollbar-width: none; padding-bottom: 6px; }
.pic-strip::-webkit-scrollbar { display: none; }
.pic-row { margin-top: 16px; }
.pic-row .pic-strip { margin-top: 0; }
.pic-track { position: relative; height: 4px; margin: 8px 2px 0; border-radius: 999px; background: var(--well); cursor: pointer; touch-action: none; }
.pic-track[hidden] { display: none; }
.pic-thumb { position: absolute; top: -2px; bottom: -2px; left: 0; min-width: 28px; border-radius: 999px; background: var(--faint); transition: background .2s var(--ease); }
.pic-track:hover .pic-thumb, .pic-thumb.drag { background: var(--muted); }
.pic-track::before { content: ""; position: absolute; inset: -8px 0; }
.pic { position: relative; flex: none; height: 104px; border: 0; padding: 0; background: var(--well); border-radius: 8px; overflow: hidden; cursor: pointer; box-shadow: var(--card-shadow); }
.pic img { height: 100%; width: auto; min-width: 72px; max-width: 180px; object-fit: cover; display: block; transition: transform .35s var(--ease); }
.pic:hover img { transform: scale(1.05); }
@media (prefers-reduced-motion: reduce) { .pic img { transition: none; } }
.pic:hover, .pic:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.spec-head .tag.local { color: var(--ink); }
.spec.nospec p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.specimen { margin-top: 12px; font-size: 30pt; line-height: 1.15; overflow-wrap: anywhere; color: var(--ink); min-height: 1.15em; }
.specimen.vertical { writing-mode: vertical-lr; max-height: 4.4em; line-height: 1.3; }
.face h3 { margin: 6px 0 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.face .by { margin: 0; color: var(--muted); font-size: 14px; }
.face .story { margin: 2px 0 0; line-height: 1.6; text-wrap: pretty; }
.face .fact { margin: 0; color: var(--text-2); line-height: 1.6; text-wrap: pretty; }
.face .fact em { font-family: var(--serif); font-style: italic; color: var(--ink); font-size: 1.1em; margin-right: 4px; }
.face .note { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
.face-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; }
.face-acts { display: flex; align-items: center; gap: 8px; flex: none; }
.fav-btn { width: 30px; height: 30px; flex: none; border: 0; border-radius: 6px; background: var(--well); color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.fav-btn:hover { color: var(--ink); background: var(--rule); }
.fav-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; overflow: visible; }
.fav-btn[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.fav-btn[aria-pressed="true"] svg { fill: currentColor; }
.fav-btn.pop svg { animation: beat .4s var(--ease); }
@keyframes beat { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
.fav-n { min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; line-height: 16px; text-align: center; font-variant-numeric: tabular-nums; }
.fav-open[aria-expanded="true"] { color: var(--ink); }
.m-tools { display: flex; align-items: center; gap: 8px; flex: none; }
.fav-list { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 10px; }
.fav-list li { display: flex; align-items: stretch; gap: 8px; }
.fav-go { flex: 1; min-width: 0; text-align: left; border: 0; background: var(--ground); box-shadow: var(--card-shadow); border-radius: 10px; padding: 12px 14px; cursor: pointer; color: var(--ink); display: grid; gap: 4px; }
.fav-go:hover { box-shadow: 0 0 0 1.5px var(--ink); }
.fav-go .nm { font-size: 24px; line-height: 1.2; overflow-wrap: anywhere; }
.fav-go .meta { font-size: 12px; color: var(--muted); }
.fav-list .fav-btn { align-self: center; }

.face-head h3 { margin: 0; }
.dl {
  display: inline-flex; align-items: center; gap: 6px; flex: none; text-decoration: none; white-space: nowrap;
  font-size: 13px; font-weight: 500; color: var(--paper); background: var(--ink); border-radius: 6px; padding: 5px 10px 5px 8px;
}
.dl:hover { opacity: .85; }
.dl svg, .ext svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.links { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 2px 0 0; padding: 0; list-style: none; font-size: 13px; }
.ext { display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); text-decoration: none; }
.ext:hover { color: var(--ink); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.ext svg { width: 12px; height: 12px; }
.empty { margin: 14px 0 0; color: var(--text-2); }
/* big glyph heading each country */
.hero-mark { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; height: 118px; overflow: hidden; border-bottom: 1px solid var(--rule); margin: 0 0 16px; }
.hm-glyph { font-size: 150px; line-height: .8; letter-spacing: -.01em; color: var(--ink); transform: translateY(14%); white-space: nowrap; }
.hm-cap { font-size: 12px; color: var(--muted); padding-bottom: 10px; text-align: right; max-width: 46%; line-height: 1.4; }
.lede-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
.lede-row .lede { margin: 0; }
.share-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--well); color: var(--ink); border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
.share-btn:hover { background: var(--rule); }
.share-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
/* images on entries */
.face-img { margin: 4px 0 0; display: grid; gap: 6px; }
.face-img img { width: 100%; height: auto; max-height: 380px; object-fit: contain; border-radius: 10px; background: var(--well); display: block; }
.face-img.portrait { grid-template-columns: 92px minmax(0, 1fr); align-items: center; gap: 14px; }
.face-img.portrait img { width: 92px; height: 116px; max-height: none; object-fit: cover; }
.face-img figcaption { font-size: 12px; color: var(--muted); line-height: 1.5; }
.face-img figcaption a { color: inherit; }
.img-tools { display: flex; gap: 8px; flex-wrap: wrap; }
.img-btn { border: 0; background: none; padding: 0; font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.img-btn:hover { color: var(--ink); }
/* share dialog */
.share-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.share-wrap img { width: 100%; height: auto; border-radius: 10px; box-shadow: var(--card-shadow); display: block; }
.share-side { display: grid; gap: 14px; align-content: start; }
.share-side p { margin: 0; color: var(--text-2); font-size: 14px; line-height: 1.55; }
/* anatomy */
.anat-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.anat-head h3 { margin: 0; }
.anat { margin-top: 32px; border-top: 1px solid var(--rule); padding-top: 18px; }
.anat h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.anat svg { width: 100%; height: auto; display: block; color: var(--ink); overflow: visible; }
.anat-stats { margin: 8px 0 0; font-size: 13px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 18px; }
.anat-note { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
/* timeline note */
.tl-note { flex-basis: 100%; text-align: center; font-size: 12.5px; color: var(--text-2); line-height: 1.35; min-height: 1.35em; }
.tl-note b { font-weight: 550; color: var(--ink); }
.form .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--text-2); }
.form .check input { width: auto; margin-top: 2px; }
.q-photo { width: 120px; height: 90px; object-fit: cover; border-radius: 6px; background: var(--well); }
@media (max-width: 720px) { .share-wrap { grid-template-columns: 1fr; } .hm-glyph { font-size: 128px; } .hero-mark { height: 100px; } }
.similar { margin-top: 6px; background: var(--well); border-radius: 10px; padding: 12px 14px 14px; min-width: 0; }
.sim-head { margin: 0; font-size: 13px; font-weight: 550; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; }
.sim-head span { color: var(--muted); font-weight: 450; }
.sim-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; }
.sim-list li { display: grid; gap: 6px; min-width: 0; }
.sim-list li + li { border-top: 1px solid var(--rule); padding-top: 12px; }
.sim-list .specimen { margin-top: 0; line-height: 1.2; }
.sim-why { margin: 0; font-size: 13px; color: var(--text-2); line-height: 1.5; }
.sim-why strong { color: var(--ink); font-weight: 550; }
.sim-lic { margin: 0; font-size: 12px; color: var(--muted); }
.sim-links { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }

/* country index inside the panel */
.region { margin-top: 24px; }
.region h4 { margin: 0; display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 550; }
.region h4 i { flex: 1; height: 1px; background: var(--rule); }
.region h4 .n { font-family: var(--serif); font-style: italic; color: var(--faint); font-weight: 400; font-size: 15px; }
.index { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.index button {
  display: flex; gap: 8px; align-items: baseline; width: 100%; padding: 4px 0; background: none; border: 0; text-align: left;
  cursor: pointer; color: var(--text-2);
}
.index button .num { color: var(--faint); font-variant-numeric: tabular-nums; min-width: 2ch; font-size: 13px; }
.index button .c { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.index button:hover, .index button[aria-current="true"] { color: var(--ink); }
.panel-foot { margin: 32px 0 0; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; line-height: 1.5; }

.tip {
  position: fixed; left: 0; top: 0; z-index: 5; pointer-events: none; padding: 6px 9px; border-radius: 6px;
  background: var(--paper); box-shadow: var(--card-shadow); font-size: 13px; font-weight: 500; white-space: nowrap;
}
.tip span { color: var(--muted); font-weight: 450; margin-left: 6px; }

@media (max-width: 720px) {
  .top { padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand p, .brand h1 span { display: none; }
  .actions { gap: 14px; }
  .bottom { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 12px; }
  .hint-mouse { display: none !important; }
  .panel {
    top: auto; left: 0; width: auto; height: min(66%, 620px); border-radius: 14px 14px 0 0;
    box-shadow: 0 -1px 0 0 var(--rule), 0 -20px 40px -20px rgb(0 0 0 / .25);
    padding-left: env(safe-area-inset-left, 0px);
    transform: translateY(calc(100% + 32px));
  }
  .panel-bar { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  .panel-body { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
  .title { font-size: 26px; }
  .tools { grid-template-columns: 1fr; }
}
@media (hover: none) { .hint-mouse { display: none !important; } }
@media (hover: hover) and (min-width: 721px) { .hint-touch { display: none !important; } }
@media (prefers-reduced-motion: reduce) {
  dialog.modal[open] { animation: none; }
  .panel, .panel.open, .actions, .actions.tucked, .bottom { transition: none; }
  .panel.open .bar-tools { animation: none; }
  .panel.open .rv { animation: none; opacity: 1; transform: none; }
  .pin .dot, .pin .chip { transition: none; }
  .fav-btn.pop svg { animation: none; }
}
/* ---------- anatomy explorer ---------- */
dialog.anat-full { border: 0; padding: 0; margin: 0; width: 100vw; max-width: 100vw; height: 100vh; height: 100dvh; max-height: 100vh; max-height: 100dvh; background: var(--ground); color: var(--ink); }
dialog.anat-full[open] { display: flex; flex-direction: column; animation: anIn .35s var(--ease); }
.an-bar, .an-controls, .an-pick, .an-stats { flex: none; }
.an-main { flex: 1 1 auto; }
dialog.anat-full::backdrop { background: var(--ground); }
@keyframes anIn { from { opacity: 0; } to { opacity: 1; } }
.an-bar { display: flex; align-items: center; gap: 16px; padding: 14px 20px 10px; }
.an-id { min-width: 0; flex: 1; }
.an-eyebrow { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.an-id h2 { margin: 2px 0 0; font-size: 26px; font-weight: 400; line-height: 1.1; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.an-sub { margin: 3px 0 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.an-modes { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--well); flex: none; }
.an-modes button { border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 550; padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.an-modes button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: var(--card-shadow); }
.an-acts { display: flex; align-items: center; gap: 8px; flex: none; }
.an-acts .btn { padding: 7px 12px; font-size: 13px; }
.an-controls { display: flex; align-items: center; gap: 10px; padding: 0 20px 10px; flex-wrap: wrap; }
.an-presets { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.an-presets button { border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 15px; cursor: pointer; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.an-presets button:hover { border-color: var(--faint); }
.an-presets .an-pickbtn { font-family: var(--sans); font-size: 13px; color: var(--text-2); }
.an-pickbtn[aria-expanded="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
#anText { width: min(280px, 100%); border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 14px; }
#anText:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.an-pick { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 20px 10px; max-height: 96px; overflow-y: auto; }
.an-pick button { width: 34px; height: 34px; border: 0; border-radius: 6px; background: var(--paper); color: var(--ink); font-size: 19px; cursor: pointer; box-shadow: var(--card-shadow); }
.an-pick button:hover { background: var(--accent-soft); color: var(--accent); }
.an-main { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.an-stage { position: relative; min-height: 0; overflow: hidden; touch-action: none; cursor: crosshair; }
.an-stage.zoomed { cursor: grab; }
.an-stage.panning { cursor: grabbing; }
.an-zoom { position: absolute; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: var(--paper); border: 1px solid var(--rule); box-shadow: var(--card-shadow); z-index: 2; }
.an-zoom button { border: 0; background: none; color: var(--ink); width: 30px; height: 28px; border-radius: 7px; cursor: pointer; display: grid; place-items: center; font: 550 12px var(--sans); }
.an-zoom button svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
.an-zoom button:hover:not(:disabled) { background: var(--well); }
.an-zoom button:disabled { color: var(--faint); cursor: default; }
.an-zoom button.fit { width: auto; padding: 0 10px; }
.an-zoom output { min-width: 44px; text-align: center; font: 500 12px var(--sans); color: var(--text-2); font-variant-numeric: tabular-nums; }
.an-zhint { position: absolute; left: 14px; bottom: 18px; margin: 0; font-size: 11.5px; color: var(--muted); pointer-events: none; }
@media (hover: none) { .an-zhint { display: none; } }
@media (max-width: 640px) { .an-zoom { right: 8px; bottom: 8px; } }
.an-stage > canvas, .an-stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.an-stage > svg { pointer-events: none; overflow: visible; }
.an-status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; width: min(440px, calc(100% - 40px)); text-align: center; font-size: 14px; line-height: 1.5; color: var(--muted); z-index: 3; }
.an-status .btn { display: block; margin: 12px auto 0; }
.an-guide { stroke: var(--ink); stroke-opacity: .16; stroke-width: 1; stroke-dasharray: 3 4; }
.an-guide.solid { stroke-opacity: .42; stroke-dasharray: none; }
.an-gl { font: 500 11px var(--sans); fill: var(--muted); letter-spacing: .01em; paint-order: stroke; stroke: var(--ground); stroke-width: 3px; stroke-linejoin: round; }
@media (max-width: 640px) { .an-gl { font-size: 10px; } }
.an-lead { fill: none; stroke: var(--accent); stroke-width: 1; stroke-opacity: .55; }
.an-lead.on { stroke-opacity: 1; stroke-width: 1.5; }
.an-dot { fill: var(--accent); stroke: var(--ground); stroke-width: 1.5; }

    { name: "Fraktur", by: "Blackletter tradition", year: "1500s onward", where: "German-speaking Europe",

    { name: "Optima", by: "Hermann Zapf", year: "1958", where: "Frankfurt · Stempel",

    { name: "Palatino", by: "Hermann Zapf", year: "1949", where: "Stempel",

      fact: "Fira Sans, the free font shown here, was adapted from it in 2013 for Mozilla’s Firefox OS.", src2: WIKI("Fira_(typeface)") },

/* ---------- layers + timeline ---------- */
const tl = $("#tl"), tlYear = $("#tlYear"), tlPlay = $("#tlPlay"), tlIcon = $("#tlIcon");
const PLAY_D = "M3 1.5v9l7.5-4.5z", PAUSE_D = "M2.5 1.5h2.5v9H2.5zM7 1.5h2.5v9H7z";
function buildTimeline(keepYear) {
  const ys = new Set();

  tValues = [...ys].sort((a, b) => a - b); tValues.push(Infinity);
  tl.max = String(tValues.length - 1);
  if (keepYear == null || keepYear === Infinity) tIndex = tValues.length - 1;
  else { const k = tValues.findIndex(v => v > keepYear); tIndex = k <= 0 ? 0 : k - 1; }
  tl.value = String(tIndex); showYear();
}
function showYear() {
  const t = atToday() ? "Today" : fmtYear(yearLimit());
  tlYear.textContent = t;
  tl.setAttribute("aria-valuetext", atToday() ? "Today: everything" : `Up to ${t}`);
}
function timeNote() {
  const el = $("#tlNote");
  if (atToday()) { el.hidden = true; el.textContent = ""; return; }
  const y = yearLimit();
  const at = Object.values(TYPE).flatMap(t => t.fonts).filter(f => f.layer === layer && f.y === y);
  el.hidden = false;
  el.innerHTML = at.length ? `New in ${esc(fmtYear(y))}: ${at.slice(0, 3).map(f => `<b>${esc(f.name)}</b>, ${esc(label(byName.get(f.country)))}`).join(" · ")}${at.length > 3 ? ` and ${at.length - 3} more` : ""}` : "";
}
function afterTimeChange() {

}
function setLayer(l, first) {

  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.layer === l)));
  stopPlay(); buildTimeline(null); refreshMap(); timeNote();

}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { if (b.dataset.layer !== layer) setLayer(b.dataset.layer); });
tl.addEventListener("input", () => { stopPlay(); tIndex = +tl.value; afterTimeChange(); });
let playTimer = 0;
function stopPlay() {
  if (playTimer) clearInterval(playTimer);
  playTimer = 0; tlIcon.setAttribute("d", PLAY_D); tlPlay.setAttribute("aria-label", "Play the timeline");
}
tlPlay.onclick = () => {
  if (playTimer) return stopPlay();

    const a = await getAssets(); if (!a) return id;
    const r = await fetch("/_blob/" + id); if (!r.ok) return id;
    return (await a.upload(await r.blob(), { type: "image/webp" })).id;
  } catch (e) { return id; }
}
const imgD = $("#imgD"); wireDialog(imgD);
function openImage(f) {
  const im = IMAGES[imgId(f)] || {};
  imgD.innerHTML = `
    <div class="m-bar"><div><h2 id="imgTitle">${im.assetId ? "Replace" : "Add"} an image</h2><p class="sub">${esc(f.name)} · ${esc(label(byName.get(f.country)))}</p></div>${CLOSE_BTN}</div>
    <div class="m-body">
      <p class="form-note">Add a photo of the typeface in use, a historical specimen page, or an artefact. Only use images you’re allowed to publish, and credit them.</p>
      <form class="form" id="imgForm" novalidate>
        <label class="full"><span>Image <span class="req">*</span></span><input name="file" type="file" accept="image/jpeg,image/png,image/webp" required></label>
        <label class="full"><span>Describe the image for people who can’t see it <span class="req">*</span></span><input name="alt" maxlength="200" value="${esc(im.alt || "")}" autocomplete="off"></label>
        <label class="full"><span>Caption</span><input name="caption" maxlength="160" value="${esc(im.caption || "")}" autocomplete="off" placeholder="e.g. Caslon’s specimen sheet, 1734"></label>
        <label><span>Credit <span class="req">*</span></span><input name="credit" maxlength="120" value="${esc(im.credit || "")}" autocomplete="off" placeholder="Photographer, museum or archive"></label>
        <label><span>Licence <span class="req">*</span></span><select name="licence">${LICENCES.map(l => `<option${l === im.licence ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></label>
        <label class="full"><span>Source link</span><input name="source" type="url" value="${esc(im.source || "")}" placeholder="https://" autocomplete="off"></label>
        <div class="full row-btns" style="justify-content:flex-start"><button class="btn primary" type="submit" id="imgSave">Save image</button></div>
      </form>
      <p class="status" id="imgStatus" role="status"></p>
    </div>`;
  const form = $("#imgForm"), st = $("#imgStatus");
  form.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(form), file = fd.get("file");
    const d = { alt: String(fd.get("alt") || "").trim(), caption: String(fd.get("caption") || "").trim(), credit: String(fd.get("credit") || "").trim(), licence: String(fd.get("licence") || ""), source: String(fd.get("source") || "").trim() };
    const bad = [];
    if (!file || !file.size) bad.push("an image"); if (!d.alt) bad.push("a description"); if (!d.credit) bad.push("a credit");
    if (d.licence !== "Own photo" && !/^https:\/\/\S+\.\S+/.test(d.source)) bad.push("a source link starting with https://");
    st.className = "status";
    if (bad.length) { st.classList.add("err"); st.textContent = `Please add ${bad.join(", ")}.`; return; }
    const [db, assets] = await Promise.all([getDb(), getAssets()]);
    if (!db || !assets) { st.classList.add("err"); st.textContent = "Only the owner and editors of this page can add images."; return; }
    $("#imgSave").disabled = true; st.textContent = "Uploading…";
    try {
      const up = await assets.upload(await shrinkImage(file), { type: "image/webp" });
      const old = im.assetId;
      await db.doc("images/" + imgId(f)).set({ ...d, key: favKey(f), assetId: up.id, addedAt: Date.now() });
      if (old && old !== up.id) assets.delete(old).catch(() => {});
      imgD.close();
    } catch (err) {
      st.classList.add("err");
      st.textContent = err && err.code === "too_large" ? "That image is too large. Try a smaller file." : err && err.code === "unsupported_type" ? "That file type isn’t supported. Use a JPEG, PNG or WebP image." : "The image couldn’t be saved. Please try again.";
      $("#imgSave").disabled = false;
    }
  };
  imgD.showModal();
}
async function removeImage(f, btn) {
  const im = IMAGES[imgId(f)]; if (!im) return;
  btn.disabled = true;
  try {
    const db = await getDb(); await db.doc("images/" + imgId(f)).delete();
    const a = await getAssets(); if (a && im.assetId) a.delete(im.assetId).catch(() => {});
  } catch (e) { btn.disabled = false; }
}
async function startImages() {
  editorNow = await isEditor().catch(() => false);
  if (editorNow && panelOpen && panelMode === "country" && sel) renderCountry(sel);
  const db = await getDb(); if (!db) return;
  try {
    db.collection("images").onSnapshot(snap => {
      const next = {}; snap.docs.forEach(d => { next[d.id] = d.data() || {}; });
      IMAGES = next;
      if (panelOpen && panelMode === "country" && sel) {
        const y = panelBody.scrollTop; renderCountry(sel); panelBody.scrollTop = y;
      }
    }, () => {});
  } catch (e) {}
}

/* ---------- anatomy, measured from the font itself ---------- */
async function drawAnatomy(gf, box) {
  try { await Promise.race([document.fonts.load(`400 100px "${gf}"`, "HamburgHolyxbdgp"), new Promise(r => setTimeout(r, 3000))]); } catch (e) {}
  if (!box.isConnected) return;
  const word = (box.clientWidth || 760) < 520 ? "Holy" : "Hamburg";
  const c = document.createElement("canvas").getContext("2d");
  const at = S => { c.font = `400 ${S}px "${gf}", serif`; return c; };
  const VW = Math.max(300, Math.round(box.clientWidth || 760)), x0 = VW < 520 ? 92 : 120;
  let S = 160; const W = at(S).measureText(word).width;
  S = Math.min(160, 160 * (VW - x0 - 12) / W);
  const m = s => at(S).measureText(s);
  const cap = m("H").actualBoundingBoxAscent, xh = m("x").actualBoundingBoxAscent;
  const asc = Math.max(...[..."bdhkl"].map(ch => m(ch).actualBoundingBoxAscent));
  const desc = Math.max(...[..."gjpqy"].map(ch => m(ch).actualBoundingBoxDescent));
  if (!(cap > 0 && xh > 0)) { box.innerHTML = `<p class="anat-note">This typeface couldn’t be measured here.</p>`; return; }
  const top = 20, base = top + Math.max(asc, cap), H = base + desc + 22, x1 = VW;
  const rows = [["Ascender", base - asc], ["Cap height", base - cap], ["x-height", base - xh], ["Baseline", base], ["Descender", base + desc]];
  const lab = rows.map(r => ({ t: r[0], y: r[1], ly: r[1] })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < lab.length; i++) if (lab[i].ly - lab[i - 1].ly < 14) lab[i].ly = lab[i - 1].ly + 14;
  const lines = rows.map(([t, y]) => `<line x1="${x0 - 10}" x2="${x1}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="currentColor" stroke-opacity="${t === "Baseline" ? .55 : .2}" stroke-width="1" ${t === "Baseline" ? "" : 'stroke-dasharray="3 4"'}/>`).join("");
  const labels = lab.map(l => `<text x="0" y="${(l.ly + 4).toFixed(1)}" font-size="12" fill="currentColor" fill-opacity=".62" font-family="Geist, Arial, sans-serif">${l.t}</text>`).join("");
  box.innerHTML = `<svg viewBox="0 0 ${VW} ${Math.ceil(H)}" width="${VW}" height="${Math.ceil(H)}" role="img" aria-label="${esc(word)} set in ${esc(gf)}, with its ascender, cap height, x-height, baseline and descender marked">${lines}${labels}<text x="${x0 + 6}" y="${base.toFixed(1)}" font-size="${S.toFixed(1)}" fill="currentColor" style="font-family:'${esc(gf)}', serif">${word}</text></svg>
    <p class="anat-stats"><span>x-height: ${Math.round(xh / cap * 100)}% of the cap height</span><span>Ascenders: ${Math.round(asc / cap * 100)}%</span><span>Descenders: ${Math.round(desc / cap * 100)}%</span></p>
    <p class="anat-note">Measured from the font file in your browser.</p>`;
}

    <div class="share-side"><p>A 1080 × 1350 image, the size of an Instagram post. Typefaces that are free to show are set in their real font; the others are named in plain type.</p>
    <div class="row-btns" style="justify-content:flex-start"><button class="btn primary" type="button" id="shareSave" disabled>Save image</button></div><p class="status" id="shareStatus" role="status"></p></div></div></div>`;
  shareD.showModal();
  const cv = await drawCard(id);
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  const url = URL.createObjectURL(blob);
  $("#sharePrev").innerHTML = `<img src="${url}" alt="Share card for ${esc(label(id))}">`;
  const save = $("#shareSave"), st = $("#shareStatus");
  const dl = await getDownloads();
  if (!dl) {
    save.hidden = false; save.disabled = false;
    save.onclick = () => { const a = document.createElement("a"); a.href = url; a.download = `atlas-of-type-${c.n.toLowerCase().replace(/[^a-z]+/g, "-")}.png`; document.body.appendChild(a); a.click(); a.remove(); st.textContent = "Saved to your downloads."; };
    return;
  }
  save.disabled = false;
  save.onclick = async () => {
    st.className = "status"; st.textContent = "";
    try {
      await dl.save({ filename: `atlas-of-type-${c.n.toLowerCase().replace(/[^a-z]+/g, "-")}.png`, data: blob });
      st.textContent = "Saved.";
    } catch (err) {
      if (err && err.code === "declined") return;
      if (err && err.code === "rate_limited") { st.textContent = "A save is already waiting for your answer."; return; }
      save.hidden = true; st.textContent = "Saving isn’t available here. Right-click or long-press the image to save it.";
    }
  };
}

addEventListener("resize", resize);
reduced.addEventListener("change", () => { view.auto = !reduced.matches; request(); });
syncFavUI();
init().then(() => { startCommunity(); startFavs(); startImages(); }).catch(err => {
  console.error(err);
  const l = $("#loading"); if (l) l.textContent = "The globe couldn’t load. Refresh the page to try again.";
});
})();
</script>

</body>
